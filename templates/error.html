{% extends "base.html" %}
{% block title %}{{ title }} &middot; {{ app_title }}{% endblock %}
{% block content %}
<div class="error-page">
  <h2>{{ title }}</h2>
  <pre>{{ message }}</pre>
  {% if hint %}<p class="note">{{ hint }}</p>{% endif %}
  <div class="btn-row" style="justify-content:center;margin-top:18px">
    <a class="btn" href="{{ url_for('index') }}">Back to dashboard</a>
    <a class="btn secondary" href="{{ url_for('reload_artifacts') }}">Reload artifacts</a>
  </div>
</div>
{% endblock %}
